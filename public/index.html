<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenAI-Compatible Proxy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0b0e14; color: #e6e6e6; padding: 24px; }
  main { width: 100%; max-width: 560px; }
  .card { background: #151a23; border: 1px solid #232b38; border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.35rem; margin: 0 0 10px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: #8b96a8; margin: 20px 0 8px; }
  .pill { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px;
          background: #10321f; color: #4ade80; border: 1px solid #14532d; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem;
         background: #0b0e14; border: 1px solid #232b38; border-radius: 8px; padding: 2px 6px; }
  code.block { display: block; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
  ul { margin: 8px 0; padding-left: 20px; }
  li { margin: 6px 0; font-size: .95rem; }
  p { font-size: .9rem; color: #b6bfcc; }
</style>
</head>
<body>
  <main class="card">
    <h1>OpenAI-Compatible Proxy</h1>
    <span class="pill" id="status">checking…</span>
    <h2>Base URL</h2>
    <code class="block" id="base"></code>
    <h2>Endpoints</h2>
    <ul>
      <li><code>POST /v1/chat/completions</code></li>
      <li><code>GET /v1/models</code></li>
    </ul>
    <p>Send <code>Authorization: Bearer &lt;PROXY_API_KEY&gt;</code> with every request.</p>
    <p id="mode"></p>
  </main>
  <script>
    document.getElementById("base").textContent = location.origin + "/v1";
    fetch("/health")
      .then((r) => r.json())
      .then((h) => {
        document.getElementById("status").textContent = "running";
        document.getElementById("mode").textContent =
          h.provider === "mock"
            ? "LLM mode: mock — no provider key configured. Add OPENAI_API_KEY in your Base44 secrets to go live (no code change needed)."
            : "LLM mode: live provider (" + h.provider + ")";
      })
      .catch(() => (document.getElementById("status").textContent = "unreachable"));
  </script>
</body>
</html>
